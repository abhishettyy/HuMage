<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dayflow — HRMS</title>

    <!-- Fonts: Inter for UI, JetBrains Mono for IDs / timestamps / money (per UI-DESIGN.md §4) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tabler icons (outline) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/@tabler/icons-webfont/2.44.0/tabler-icons.min.css"
    />

    <!-- Tailwind via CDN for hackathon speed. Swap for a proper build (postcss+tailwind.config.js)
         post-hackathon if this ships past the demo. -->
    <script>
      tailwind = { config: {} };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Flight-deck palette — matches UI-DESIGN.md §3. Keep to teal / amber / gray + a rare red.
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "ui-monospace", "monospace"],
            },
            colors: {
              teal: {
                50: "#E1F5EE",
                100: "#9FE1CB",
                200: "#5DCAA5",
                400: "#1D9E75",
                600: "#0F6E56",
                800: "#085041",
                900: "#04342C",
              },
              amber: {
                50: "#FAEEDA",
                100: "#FAC775",
                200: "#EF9F27",
                400: "#BA7517",
                600: "#854F0B",
                800: "#633806",
                900: "#412402",
              },
              slate: {
                50: "#F1EFE8",
                100: "#D3D1C7",
                200: "#B4B2A9",
                400: "#888780",
                600: "#5F5E5A",
                800: "#444441",
                900: "#2C2C2A",
              },
              danger: {
                50: "#FCEBEB",
                200: "#F09595",
                600: "#A32D2D",
                800: "#791F1F",
              },
            },
          },
        },
      };
    </script>

    <style>
      body {
        background: #f7f6f2;
        color: #2c2c2a;
      }
      /* dashed "perforation" divider used on boarding-pass cards */
      .perforation {
        border-top: 1.5px dashed #b4b2a9;
      }
    </style>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
